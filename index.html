<head>
  <meta charset="UTF-8" />

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    .hide-scrollbar::-webkit-scrollbar { display: none; } .hide-scrollbar { scrollbar-width: none; }
    .hero { background: linear-gradient(135deg, #4338CA 0%, #5B50E6 55%, #7C3AED 100%); }

</head>
<body class="antialiased min-h-screen">
  <div id="root"></div>
  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 hidden w-[90%] max-w-xs bg-slate-900 text-white rounded-2xl px-4 py-3 text-xs font-medium shadow-xl"></div>
  <script>
    const PROFILES = {
      evangelica: { label: 'Igreja Evangélica', service: 'Culto', services: 'Cultos', tithe: 'Dízimo', offering: 'Oferta', missions: 'Missões', ministry: 'Ministério', prayer: 'Pedido de Oração', prayers: 'Pedidos de Oração', word: 'Palavra do Dia', verse: '“Porque onde estiverem dois ou três reunidos em meu nome, ali estou no meio deles.” — Mateus 18:20' },
      catolica: { label: 'Paróquia Católica', service: 'Missa', services: 'Missas', tithe: 'Dízimo', offering: 'Oferta', missions: 'Ação Social', ministry: 'Pastoral', prayer: 'Intenção de Oração', prayers: 'Intenções de Oração', word: 'Liturgia do Dia', verse: '“O Senhor é o meu pastor, nada me faltará.” — Salmo 23:1' },
      generico: { label: 'Templo / Genérico', service: 'Encontro', services: 'Encontros', tithe: 'Contribuição', offering: 'Doação', missions: 'Projetos Sociais', ministry: 'Equipe', prayer: 'Pedido de Apoio', prayers: 'Pedidos de Apoio', word: 'Reflexão do Dia', verse: '“A união e o cuidado mútuo fortalecem toda a comunidade.”' }
    };
    const ROLES = {
      admin: { label: 'Pastor / Admin', tabs: ['overview', 'members', 'finance', 'content', 'prayers', 'schedules', 'settings'] },
      treasurer: { label: 'Tesouraria', tabs: ['overview', 'finance'] },
      secretary: { label: 'Secretaria', tabs: ['overview', 'members', 'content'] },
      leader: { label: 'Líder de Ministério', tabs: ['overview', 'schedules', 'prayers'] },
      member: { label: 'Membro', tabs: [] }
    };
    const TAB_LABEL = { overview: 'Resumo', members: 'Membros', finance: 'Pix & Financeiro', content: 'Avisos & Eventos', prayers: 'Oração', schedules: 'Escalas', settings: 'Conta & Marca' };
    const DB_KEY = 'cmp_db_v2', SS_KEY = 'cmp_session_v2';

    function seed() {
      const c1 = 'c_vida', c2 = 'c_sj';
      return {
        churches: [
          { id: c1, slug: 'vidanova', name: 'Igreja Vida Nova', cnpj: '12.345.678/0001-90', city: 'Volta Redonda', pixKey: 'financeiro@igrejavidanova.org.br', profile: 'evangelica', dailyMessage: PROFILES.evangelica.verse, joinMode: 'approval', plan: 'Essencial' },
          { id: c2, slug: 'saojose', name: 'Paróquia São José', cnpj: '98.765.432/0001-10', city: 'Barra Mansa', pixKey: 'dizimo@paroquiasaojose.org.br', profile: 'catolica', dailyMessage: PROFILES.catolica.verse, joinMode: 'open', plan: 'Teste grátis' }
        ],
        users: [
          { id: 'u_super', name: 'Raphael (Comunidade+)', email: 'admin@comunidademais.app', pass: '123456', isSuper: true },
          { id: 'u_pr', name: 'Pr. André Souza', email: 'pastor@vidanova.org', pass: '123456' },
          { id: 'u_tes', name: 'Marta Oliveira', email: 'tesouraria@vidanova.org', pass: '123456' },
          { id: 'u_lid', name: 'Mariana Costa', email: 'mariana@email.com', pass: '123456' },
          { id: 'u_fiel', name: 'Lucas Silva', email: 'lucas@email.com', pass: '123456' },
          { id: 'u_ana', name: 'Ana Paula', email: 'ana@email.com', pass: '123456' },
          { id: 'u_jp', name: 'João Pedro', email: 'joao@email.com', pass: '123456' },
          { id: 'u_padre', name: 'Pe. Carlos', email: 'padre@saojose.org', pass: '123456' },
          { id: 'u_rosa', name: 'Rosa Lima', email: 'rosa@email.com', pass: '123456' }
        ],
        memberships: [
          { id: 'm1', churchId: c1, userId: 'u_pr', role: 'admin', status: 'active', ministry: 'Pastoral' },
          { id: 'm2', churchId: c1, userId: 'u_tes', role: 'treasurer', status: 'active', ministry: 'Tesouraria' },
          { id: 'm3', churchId: c1, userId: 'u_lid', role: 'leader', status: 'active', ministry: 'Louvor' },
          { id: 'm4', churchId: c1, userId: 'u_fiel', role: 'member', status: 'active', ministry: 'Louvor' },
          { id: 'm5', churchId: c1, userId: 'u_jp', role: 'member', status: 'active', ministry: 'Recepção' },
          { id: 'm6', churchId: c1, userId: 'u_ana', role: 'member', status: 'pending', ministry: '' },
          { id: 'm7', churchId: c2, userId: 'u_padre', role: 'admin', status: 'active', ministry: 'Pastoral' },
          { id: 'm8', churchId: c2, userId: 'u_rosa', role: 'member', status: 'active', ministry: 'Liturgia' }
        ],
        announcements: [
          { id: 'a1', churchId: c1, title: 'Inscrições abertas para o Batismo', body: 'Nosso próximo batismo será no domingo, 07/12, às 10h. Inscreva-se na aba Agenda.', tag: 'Importante', date: 'Hoje, 09:30' },
          { id: 'a2', churchId: c1, title: 'Cesta Solidária de Natal', body: 'Estamos arrecadando alimentos não perecíveis para abençoar 80 famílias da região.', tag: 'Ação Social', date: 'Ontem' },
          { id: 'a3', churchId: c2, title: 'Novena de Natal', body: 'De 16 a 24/12, às 19h, na Igreja Matriz.', tag: 'Importante', date: 'Hoje' }
        ],
        events: [
          { id: 'e1', churchId: c1, title: 'Culto da Família', date: 'Domingo • 18:30', location: 'Templo Principal', spots: 250, base: 148 },
          { id: 'e2', churchId: c1, title: 'Noite de Louvor e Adoração', date: 'Quarta • 20:00', location: 'Auditório', spots: 120, base: 64 },
          { id: 'e3', churchId: c1, title: 'Batismo', date: '07/12 • 10:00', location: 'Templo Principal', spots: 40, base: 22 },
          { id: 'e4', churchId: c2, title: 'Missa Dominical', date: 'Domingo • 08:00', location: 'Igreja Matriz', spots: 300, base: 180 }
        ],
        registrations: [{ eventId: 'e1', userId: 'u_fiel' }],
        schedules: [
          { id: 's1', churchId: c1, userId: 'u_fiel', event: 'Culto da Família — Dom 18:30', ministry: 'Louvor (Violão)', status: 'pending' },
          { id: 's2', churchId: c1, userId: 'u_fiel', event: 'Noite de Louvor — Qua 20:00', ministry: 'Mídia & Projeção', status: 'confirmed' },
          { id: 's3', churchId: c1, userId: 'u_lid', event: 'Culto da Família — Dom 18:30', ministry: 'Louvor (Vocal)', status: 'confirmed' },
          { id: 's4', churchId: c1, userId: 'u_jp', event: 'Culto da Família — Dom 18:30', ministry: 'Recepção', status: 'swap' }
        ],
        prayers: [
          { id: 'p1', churchId: c1, userId: 'u_lid', anon: false, text: 'Peço oração pela recuperação da cirurgia da minha mãe nesta semana.', isPrivate: false, status: 'praying', prayedBy: ['u_fiel', 'u_pr'], date: 'Hoje, 08:15' },
          { id: 'p2', churchId: c1, userId: 'u_jp', anon: true, text: 'Direção para uma nova porta de emprego e paz para nossa família.', isPrivate: true, status: 'new', prayedBy: [], date: 'Ontem' }
        ],
        contributions: [
          { id: 'k1', churchId: c1, userId: 'u_jp', category: 'tithe', amount: 500, status: 'pending_check', date: 'Hoje, 10:05', txid: 'CMP0001' },
          { id: 'k2', churchId: c1, userId: 'u_lid', category: 'offering', amount: 120, status: 'confirmed', date: 'Ontem', txid: 'CMP0002' },
          { id: 'k3', churchId: c2, userId: 'u_rosa', category: 'tithe', amount: 200, status: 'confirmed', date: 'Ontem', txid: 'CMP0003' }
        ],
        activity: [
          { id: 'l1', churchId: c1, time: '10:05', text: 'João Pedro informou Pix de R$ 500,00 (Dízimo)' },
          { id: 'l2', churchId: c1, time: '09:50', text: 'Ana Paula pediu para entrar na igreja' }
        ]
      };
    }

    const SB_URL = window.SUPABASE_URL || '', SB_KEY = window.SUPABASE_ANON_KEY || '';
    const sb = (window.supabase && SB_URL.startsWith('https://') && SB_KEY.length > 30) ? window.supabase.createClient(SB_URL, SB_KEY) : null;
    let db = { churches: [], users: [], memberships: [], announcements: [], events: [], registrations: [], schedules: [], prayers: [], contributions: [], activity: [], overview: [] };
    let S = { userId: null, churchId: null, view: 'app', tab: 'home', adminTab: 'overview', authMode: 'login', pix: { step: 'form', category: 'tithe', amount: 100 }, loading: !!sb };
    try { const pref = JSON.parse(localStorage.getItem('cmp_prefs') || '{}'); if (pref.churchId) S.churchId = pref.churchId; } catch (e) {}
    const inviteParam = new URLSearchParams(location.search).get('igreja');
    if (inviteParam) S.invite = inviteParam.toLowerCase().replace(/[^a-z0-9]/g, '');
    function save() { try { localStorage.setItem('cmp_prefs', JSON.stringify({ churchId: S.churchId })); } catch (e) {} }
    function loadDB() { return db; }

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const money = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const hhmm = () => new Date().toTimeString().slice(0, 5);
    const me = () => db.users.find(u => u.id === S.userId);
    const church = () => db.churches.find(c => c.id === S.churchId);
    const myMem = () => db.memberships.find(m => m.userId === S.userId && m.churchId === S.churchId);
    const role = () => (myMem() || {}).role || 'member';
    const can = tab => ROLES[role()].tabs.includes(tab);
    const isStaff = () => ROLES[role()].tabs.length > 0;
    const t = k => PROFILES[(church() || {}).profile || 'evangelica'][k] || k;
    const uname = id => (db.users.find(u => u.id === id) || {}).name || '—';
    const of = list => db[list].filter(x => x.churchId === S.churchId);
    const initials = n => n.split(' ').filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || 'C+';
    function log(text) { db.activity.unshift({ id: uid('l'), churchId: S.churchId, time: hhmm(), text }); db.activity = db.activity.slice(0, 300); }
    let toastTimer;
    function toast(m) { const e = $('toast'); e.textContent = m; e.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer = setTimeout(() => e.classList.add('hidden'), 2800); }

    const CARD = 'rounded-2xl bg-white border border-slate-200/80 p-4 shadow-sm';
    const INP = 'w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm outline-none focus:border-indigo-400';
    const BTN = 'w-full py-3 rounded-xl bg-indigo-600 text-white text-sm font-bold active:scale-[.99]';
    const BTN2 = 'w-full py-3 rounded-xl bg-white border border-slate-200 text-slate-700 text-sm font-semibold';
    const LBL = 'text-xs font-semibold text-slate-500';
    const empty = m => `<div class="text-center text-xs text-slate-400 py-6">${m}</div>`;
    function badge(st) {
      const map = { confirmed: ['Confirmado', 'emerald'], active: ['Ativo', 'emerald'], answered: ['Atendido', 'emerald'], pending_check: ['Conferir extrato', 'amber'], pending: ['Pendente', 'amber'], new: ['Novo', 'amber'], swap: ['Troca pedida', 'rose'], inactive: ['Inativo', 'slate'], praying: ['Em Oração', 'indigo'] };
      const [l, c] = map[st] || [st, 'slate'];
      return `<span class="text-[11px] px-2.5 py-0.5 rounded-full bg-${c}-50 text-${c}-700 border border-${c}-200 font-semibold whitespace-nowrap">${l}</span>`;
    }
    const row = (ic, title, sub, onDel) => `<div class="flex justify-between items-center gap-2 py-2 border-b border-slate-100 last:border-0"><div class="min-w-0"><div class="text-sm truncate">${ic} ${esc(title)}</div><div class="text-[11px] text-slate-500">${esc(sub)}</div></div><button onclick="${onDel}" class="text-xs font-semibold text-rose-600 shrink-0">Excluir</button></div>`;

    const clean = s => String(s || '').normalize('NFD').replace(/[^a-zA-Z0-9 .@-]/g, '');
    const emv = (id, v) => id + String(v.length).padStart(2, '0') + v;
    function crc16(s) {
      let c = 0xFFFF;
      for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) { c = (c & 0x8000) ? ((c << 1) ^ 0x1021) : (c << 1); c &= 0xFFFF; } }
      return c.toString(16).toUpperCase().padStart(4, '0');
    }
    function brcode(key, name, city, amount, txid) {
      const p = emv('00', '01') + emv('26', emv('00', 'br.gov.bcb.pix') + emv('01', key.trim())) + emv('52', '0000') + emv('53', '986') + emv('54', Number(amount).toFixed(2)) + emv('58', 'BR') + emv('59', clean(name).toUpperCase().slice(0, 25) || 'IGREJA') + emv('60', clean(city).toUpperCase().slice(0, 15) || 'BRASIL') + emv('62', emv('05', txid)) + '6304';
      return p + crc16(p);
    }
    function qrSvg(text, cls) {
      if (!window.qrcode) return '<div class="text-xs text-slate-400 p-6">QR indisponível sem internet</div>';
      const q = qrcode(0, 'M'); q.addData(text); q.make();
      return q.createSvgTag({ cellSize: 5, margin: 2, scalable: true }).replace('<svg ', '<svg class="' + cls + '" ');
    }
    function copy(txt, msg) { try { navigator.clipboard.writeText(txt); } catch (e) {} toast(msg); }

    const PLAN = { trial: 'Teste grátis', essencial: 'Essencial', completo: 'Completo', suspenso: 'Suspenso' };
    const PLAN_DB = Object.fromEntries(Object.entries(PLAN).map(([k, v]) => [v, k]));
    let chan = null, rtTimer = null;
    async function q(p) { const { data, error } = await p; if (error) { console.error(error); toast('Erro: ' + error.message); throw error; } return data; }
    function when(ts) {
      const d = new Date(ts), n = new Date(), hm = d.toTimeString().slice(0, 5);
      if (d.toDateString() === n.toDateString()) return 'Hoje, ' + hm;
      if (d.toDateString() === new Date(n - 86400000).toDateString()) return 'Ontem, ' + hm;
      return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }) + ' ' + hm;
    }
    async function reload() {
      if (!sb || !S.userId) { S.loading = false; render(); return; }
      try {
        const [prof, chs, mems, names] = await Promise.all([
          q(sb.from('profiles').select('id,name,email,is_platform_admin')),
          q(sb.from('churches').select('*')),
          q(sb.from('memberships').select('*')),
          q(sb.rpc('my_church_names'))
        ]);
        db.users = prof.map(u => ({ id: u.id, name: u.name, email: u.email || '', isSuper: u.is_platform_admin }));
        db.churches = chs.map(c => ({ id: c.id, slug: c.slug, name: c.name, cnpj: c.cnpj || '', city: c.city || '', pixKey: c.pix_key || '', profile: c.profile, dailyMessage: c.daily_message || PROFILES[c.profile].verse, joinMode: c.join_mode, plan: PLAN[c.plan] || c.plan }));
        (names || []).forEach(n => { if (!db.churches.some(c => c.id === n.id)) db.churches.push({ id: n.id, slug: n.slug, name: n.name, cnpj: '', city: '', pixKey: '', profile: 'evangelica', dailyMessage: '', joinMode: 'approval', plan: '' }); });
        db.memberships = mems.map(m => ({ id: m.id, churchId: m.church_id, userId: m.user_id, role: m.role, status: m.status, ministry: m.ministry || '' }));
        const mine = db.memberships.filter(m => m.userId === S.userId);
        if (!mine.some(m => m.churchId === S.churchId)) S.churchId = (mine.find(m => m.status === 'active') || mine[0] || {}).churchId || null;
        save();
        const cid = S.churchId;
        if (cid && mine.some(m => m.churchId === cid && m.status === 'active')) {
          const staff = isStaff();
          const [ann, evs, regs, cnt, sch, prs, sup, ks, act] = await Promise.all([
            q(sb.from('announcements').select('*').eq('church_id', cid).order('created_at', { ascending: false })),
            q(sb.from('events').select('*').eq('church_id', cid).order('created_at', { ascending: true })),
            q(sb.from('registrations').select('event_id,user_id')),
            q(sb.rpc('event_counts', { c: cid })),
            q(sb.from('schedules').select('*').eq('church_id', cid).order('created_at', { ascending: true })),
            q(sb.from('prayer_wall').select('*').eq('church_id', cid).order('created_at', { ascending: false })),
            q(sb.from('prayer_supports').select('prayer_id,user_id')),
            q(sb.from('contributions').select('*').eq('church_id', cid).order('created_at', { ascending: false })),
            staff ? q(sb.from('activity_log').select('*').eq('church_id', cid).order('created_at', { ascending: false }).limit(30)) : Promise.resolve([])
          ]);
          const counts = Object.fromEntries((cnt || []).map(r => [r.event_id, Number(r.total)]));
          db.registrations = regs.map(r => ({ eventId: r.event_id, userId: r.user_id }));
          db.announcements = ann.map(a => ({ id: a.id, churchId: cid, title: a.title, body: a.body, tag: a.tag || 'Aviso Geral', date: when(a.created_at) }));
          db.events = evs.map(e => ({ id: e.id, churchId: cid, title: e.title, date: e.date_label || '', location: e.location || '', spots: e.spots, base: (counts[e.id] || 0) - db.registrations.filter(r => r.eventId === e.id).length }));
          db.schedules = sch.map(s => ({ id: s.id, churchId: cid, userId: s.user_id, event: s.event_label, ministry: s.ministry, status: s.status }));
          db.prayers = prs.map(p => ({ id: p.id, churchId: cid, userId: p.user_id, anon: !p.user_id, text: p.text, isPrivate: p.is_private, status: p.status, prayedBy: sup.filter(s => s.prayer_id === p.id).map(s => s.user_id), date: when(p.created_at) }));
          db.contributions = ks.map(k => ({ id: k.id, churchId: cid, userId: k.user_id, category: k.category, amount: Number(k.amount), status: k.status, date: when(k.created_at), at: k.created_at, txid: k.txid }));
          db.activity = act.map(l => ({ id: l.id, churchId: cid, time: when(l.created_at), text: l.text }));
        }
        db.overview = (me() && me().isSuper) ? await q(sb.rpc('platform_overview')) : [];
      } catch (e) {}
      S.loading = false; render(); subscribe();
    }
    function subscribe() {
      if (!sb || chan || !S.userId) return;
      chan = sb.channel('cmp-' + Math.random().toString(36).slice(2));
      ['announcements', 'events', 'memberships', 'contributions', 'prayers', 'schedules'].forEach(tb => chan.on('postgres_changes', { event: '*', schema: 'public', table: tb }, () => {
        clearTimeout(rtTimer);
        rtTimer = setTimeout(() => { const a = document.activeElement; if (a && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName)) return; reload(); }, 500);
      }));
      chan.subscribe();
    }
    async function run(fn, okMsg) { try { await fn(); } catch (e) { return false; } if (okMsg) toast(okMsg); await reload(); return true; }
    async function log(text) { if (sb && S.churchId && S.userId) await sb.from('activity_log').insert({ church_id: S.churchId, actor_id: S.userId, text }); }

    async function doLogin(e) {
      e.preventDefault();
      const { error } = await sb.auth.signInWithPassword({ email: $('l-email').value.trim(), password: $('l-pass').value });
      if (error) toast(/confirm/i.test(error.message) ? 'Confirme seu e-mail pelo link que enviamos antes de entrar.' : 'E-mail ou senha incorretos.');
    }
    async function doSignup(e) {
      e.preventDefault();
      const name = $('s-name').value.trim(), email = $('s-email').value.trim(), password = $('s-pass').value;
      if (!name || password.length < 6) return toast('Preencha nome e senha (mín. 6).');
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name }, emailRedirectTo: location.origin + location.pathname + (S.invite ? '?igreja=' + S.invite : '') } });
      if (error) return toast(/registered/i.test(error.message) ? 'E-mail já cadastrado. Entre com ele.' : 'Erro: ' + error.message);
      if (!data.session) { S.authMode = 'login'; render(); toast('Conta criada! Abra o link que enviamos ao seu e-mail para confirmar.'); }
    }
    async function doReset() {
      const email = ($('l-email') || {}).value;
      if (!email) return toast('Digite seu e-mail no campo acima.');
      await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: location.origin + location.pathname });
      toast('Se o e-mail estiver cadastrado, enviamos um link para criar nova senha.');
    }
    async function logout() { if (sb) await sb.auth.signOut(); }
    async function joinChurch(e) {
      e.preventDefault();
      const code = $('j-code').value.trim().toLowerCase().replace(/.*igreja=/, '').replace(/[^a-z0-9]/g, '');
      let st; try { st = await q(sb.rpc('join_church', { p_slug: code })); } catch (err) { return; }
      S.invite = null; history.replaceState(null, '', location.pathname);
      await reload();
      const c = db.churches.find(x => x.slug === code);

    async function createChurch(e) {
      e.preventDefault();
      const name = $('n-name').value.trim(); if (!name) return toast('Informe o nome da igreja.');
      let base = clean(name).toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 20); if (base.length < 3) base += 'igreja';
      const args = { p_name: name, p_profile: $('n-prof').value, p_cnpj: $('n-cnpj').value.trim(), p_city: $('n-city').value.trim() || 'Brasil', p_pix_key: $('n-pix').value.trim() };
      let id = null;
      for (let i = 1; i < 30 && !id; i++) {
        const { data, error } = await sb.rpc('create_church', { ...args, p_slug: i === 1 ? base : base + i });
        if (!error) id = data; else if (!/duplicate|unique/i.test(error.message)) return toast('Erro: ' + error.message);
      }
      if (!id) return toast('Não foi possível criar a igreja.');
      S.invite = null; S.churchId = id; S.view = 'admin'; S.adminTab = 'members'; save();
      await reload(); toast('Igreja criada! Agora compartilhe o link de convite.');
    }

    const regCount = ev => ev.base + db.registrations.filter(r => r.eventId === ev.id).length;

    async function toggleReg(id) {
      const ev = db.events.find(e => e.id === id); if (!ev) return;

    function pixCat(c) { S.pix.category = c; render(); }

      render(); scrollTo(0, 0);

    async function sendPrayer(e) {

      await run(async () => { await q(sb.from('prayers').insert(row)); await log(`Novo ${t('prayer').toLowerCase()} recebido`); }, 'Pedido enviado!');

    const inviteLink = c => location.origin + location.pathname + '?igreja=' + c.slug;

          <div class="${CARD} space-y-1"><div class="font-bold text-sm mb-1">Publicados no app</div>${of('announcements').map(a => row('📢', a.title, a.date, `del('announcements','${a.id}')`)).join('')}${of('events').map(e => row('📅', e.title, `${e.date} • ${regCount(e)}/${e.spots} inscritos`, `del('events','${e.id}')`)).join('')}</div></div>`;
      } else if (A === 'prayers') {
        body = `<div class="space-y-3"><p class="text-[11px] text-slate-500 px-1">Pedidos marcados como privados aparecem só aqui, para a liderança.</p>${of('prayers').map(p => `<div class="${CARD} space-y-2"><div class="flex justify-between items-center gap-2 text-xs"><b>${p.anon ? 'Anônimo' : esc(uname(p.userId))}${p.isPrivate ? ' <span class="text-slate-500 font-normal">• Privado</span>' : ''}</b>${badge(p.status)}</div><p class="text-sm text-slate-700">${esc(p.text)}</p><div class="text-[11px] text-slate-400">${esc(p.date)} • ${p.prayedBy.length} orando</div><div class="flex gap-2"><button onclick="prayerStatus('${p.id}','praying')" class="flex-1 py-2 rounded-xl bg-indigo-50 text-indigo-700 text-xs font-semibold">Em Oração</button><button onclick="prayerStatus('${p.id}','answered')" class="flex-1 py-2 rounded-xl bg-emerald-50 text-emerald-700 text-xs font-semibold">Atendido</button></div></div>`).join('') || empty('Nenhum pedido.')}</div>`;
      } else if (A === 'schedules') {
        const act = mems.filter(m => m.status === 'active');
        body = `<div class="space-y-4"><form onsubmit="addSched(event)" class="${CARD} space-y-2.5"><div class="font-bold text-sm">Escalar voluntário</div><select id="sc-u" required class="${INP}"><option value="">Selecione o membro</option>${act.map(m => `<option value="${m.userId}">${esc(uname(m.userId))}${m.ministry ? ' — ' + esc(m.ministry) : ''}</option>`).join('')}</select><input id="sc-e" required placeholder="${esc(t('service'))} e data (ex.: Culto — Dom 18:30)" class="${INP}" /><input id="sc-m" required placeholder="Função (ex.: Louvor, Recepção, Mídia)" class="${INP}" /><button class="${BTN}">Escalar</button></form>
          <div class="${CARD} space-y-1"><div class="font-bold text-sm mb-1">Escalas</div>${of('schedules').map(s => `<div class="flex justify-between items-center gap-2 py-2 border-b border-slate-100 last:border-0"><div class="min-w-0"><div class="text-sm font-semibold truncate">${esc(uname(s.userId))} • ${esc(s.ministry)}</div><div class="text-[11px] text-slate-500 truncate">${esc(s.event)}</div></div><div class="flex items-center gap-2 shrink-0">${badge(s.status)}<button onclick="del('schedules','${s.id}')" class="text-xs text-rose-600 font-semibold">✕</button></div></div>`).join('') || empty('Nenhuma escala.')}</div></div>`;
      } else {
        const fld = (k, l, cls) => `<label class="block space-y-1"><span class="${LBL}">${l}</span><input id="st-${k}" value="${esc(c[k])}" class="${INP} ${cls || ''}" /></label>`;
        body = `<form onsubmit="saveSettings(event)" class="${CARD} space-y-3"><div class="font-bold text-sm">Conta & Marca</div>
          <label class="block space-y-1"><span class="${LBL}">Tipo / vocabulário</span><select onchange="setProfile(this.value)" class="${INP}">${Object.entries(PROFILES).map(([k, p]) => `<option value="${k}" ${c.profile === k ? 'selected' : ''}>${p.label}</option>`).join('')}</select></label>
          ${fld('name', 'Nome da igreja')}${fld('cnpj', 'CNPJ')}${fld('city', 'Cidade')}${fld('pixKey', 'Chave Pix (conta PJ da igreja)', 'font-mono')}
          <label class="block space-y-1"><span class="${LBL}">${esc(t('word'))}</span><textarea id="st-dailyMessage" rows="3" class="${INP}">${esc(c.dailyMessage)}</textarea></label>
          <label class="block space-y-1"><span class="${LBL}">Entrada de novos fiéis</span><select id="st-join" class="${INP}"><option value="approval" ${c.joinMode === 'approval' ? 'selected' : ''}>Com aprovação da secretaria</option><option value="open" ${c.joinMode === 'open' ? 'selected' : ''}>Livre (quem tem o link entra)</option></select></label>
          <div class="text-[11px] text-slate-500">Plano: <b>${esc(c.plan)}</b> • Código de convite: <b>${esc(c.slug)}</b></div>
          <button class="${BTN}">Salvar</button><button type="button" onclick="resetDemo()" class="${BTN2}">Restaurar dados da demonstração</button></form>`;
      }
      const TAB_IC = { overview: '📊', members: '👥', finance: '💠', content: '📢', prayers: '🙏', schedules: '🗓️', settings: '⚙️' };
      const cnt = x => x === 'members' && pend.length ? pend.length : x === 'finance' && pk.length ? pk.length : 0;
      return `<div class="min-h-screen flex flex-col max-w-2xl mx-auto w-full">
        <header class="hero text-white px-4 pt-4 pb-14 safe-t rounded-b-[28px] shadow-lg shadow-indigo-900/10">
          <div class="flex justify-between items-center gap-3">
            <div class="flex items-center gap-3 min-w-0"><div class="w-11 h-11 rounded-2xl bg-white/15 ring-1 ring-white/25 flex items-center justify-center font-extrabold text-sm shrink-0">${esc(initials(c.name))}</div><div class="min-w-0"><div class="text-[11px] uppercase tracking-wider text-indigo-100/90 font-semibold">Painel da Igreja</div><div class="font-bold text-base truncate">${esc(c.name)}</div></div></div>
            <button onclick="switchView('app')" class="px-3 py-2 rounded-xl bg-white text-indigo-700 text-xs font-bold shrink-0 shadow-sm active:scale-95">📱 App do Fiel</button>
          </div>
          <div class="mt-3 inline-flex items-center gap-1.5 text-[11px] font-semibold bg-white/15 ring-1 ring-white/20 rounded-full px-2.5 py-1">● ${esc(ROLES[role()].label)}${c.city ? ' • ' + esc(c.city) : ''}</div>
        </header>
        <div class="sticky top-0 z-20 -mt-9 px-3"><div class="bg-white/95 backdrop-blur rounded-2xl shadow-md border border-slate-200/70 p-1.5 flex flex-wrap justify-center gap-1">${tabs.map(x => `<button onclick="setAdminTab('${x}')" class="relative px-2.5 py-2 rounded-xl text-xs whitespace-nowrap transition ${A === x ? 'bg-indigo-600 text-white font-bold shadow-sm' : 'text-slate-600 hover:bg-slate-100 font-medium'}"><span class="mr-1">${TAB_IC[x] || ''}</span>${TAB_LABEL[x]}${cnt(x) ? `<span class="ml-1.5 inline-flex items-center justify-center min-w-[18px] h-[18px] px-1 rounded-full text-[10px] font-bold ${A === x ? 'bg-white text-indigo-700' : 'bg-amber-500 text-white'}">${cnt(x)}</span>` : ''}</button>`).join('')}</div></div>
        <main class="flex-1 p-4 pt-5 pb-10">${body}</main></div>`;
    }

    function renderSuper() {
      const plans = ['Teste grátis', 'Essencial', 'Completo', 'Suspenso'];
      const ov = db.overview || [];
      return `<div class="min-h-screen max-w-2xl mx-auto"><header class="sticky top-0 z-20 bg-slate-900 text-white px-4 pb-3 safe-t flex justify-between items-center gap-2"><div><div class="font-bold text-sm">Comunidade+ • Plataforma</div><div class="text-[11px] text-slate-300">Visão do dono do SaaS</div></div><div class="flex gap-1.5">${db.memberships.some(m => m.userId === S.userId) ? `<button onclick="S.view='app';render()" class="px-3 py-1.5 rounded-xl bg-white/10 text-xs font-bold">Minha igreja</button>` : ''}<button onclick="logout()" class="px-3 py-1.5 rounded-xl bg-white/10 text-xs font-bold">Sair</button></div></header>
        <main class="p-4 space-y-4"><div class="grid grid-cols-3 gap-3">${[['Igrejas', ov.length], ['Fiéis ativos', ov.reduce((a, c) => a + Number(c.active_members), 0)], ['Em teste', ov.filter(c => c.plan === 'trial').length]].map(([l, v]) => `<div class="rounded-2xl bg-white border border-slate-200 p-4"><div class="text-xs text-slate-500">${l}</div><div class="text-2xl font-extrabold mt-1">${v}</div></div>`).join('')}</div>
        <div class="${CARD} space-y-1"><div class="font-bold text-sm mb-1">Igrejas clientes</div>${ov.map(c => `<div class="py-2.5 border-b border-slate-100 last:border-0 flex justify-between items-center gap-2"><div class="min-w-0"><div class="text-sm font-semibold truncate">${esc(c.name)}</div><div class="text-[11px] text-slate-500">${esc((PROFILES[c.profile] || {}).label)} • ${esc(c.city || '')} • ${c.active_members} membros • código ${esc(c.slug)}</div></div><select onchange="setPlan('${c.church_id}',this.value)" class="text-xs px-2 py-1 rounded-lg bg-slate-50 border border-slate-200 shrink-0">${plans.map(p => `<option ${PLAN[c.plan] === p ? 'selected' : ''}>${p}</option>`).join('')}</select></div>`).join('') || empty('Nenhuma igreja cadastrada ainda.')}</div>
        <p class="text-[11px] text-slate-500 px-1">Por privacidade (LGPD), o dono da plataforma vê só os números de cada igreja, não os dados dos fiéis nem as contribuições. Mude o plano para "Suspenso" para bloquear uma igreja inadimplente.</p></main></div>`;
    }

    function render() {
      const r = $('root');
      if (!sb) { r.innerHTML = `<div class="min-h-screen max-w-md mx-auto px-5 py-12 text-center space-y-4"><img src="icon.svg" class="w-16 h-16 mx-auto rounded-2xl" alt="" /><h1 class="text-xl font-extrabold">Comunidade+</h1><p class="text-sm text-slate-500">Falta conectar o banco de dados: preencha a chave pública do Supabase no arquivo <b>config.js</b>.</p><a href="demo.html" class="block ${BTN}">Abrir demonstração</a></div>`; return; }
      if (S.loading) { r.innerHTML = '<div class="min-h-screen flex items-center justify-center"><div class="w-10 h-10 rounded-full border-4 border-indigo-200 border-t-indigo-600 animate-spin"></div></div>'; return; }
      if (!S.userId || !me()) { r.innerHTML = renderAuth(); return; }
      const u = me();
      if (u.isSuper && S.view === 'super') { r.innerHTML = renderSuper(); return; }
      if (S.invite) {
        const ic = db.churches.find(x => x.slug === S.invite);
        if (!ic || !db.memberships.some(m => m.userId === S.userId && m.churchId === ic.id)) { r.innerHTML = renderOnboarding(); return; }
        S.invite = null;
      }
      const c = church(), m = myMem();
      if (!c || !m) { r.innerHTML = renderOnboarding(); return; }
      if (m.status !== 'active') { r.innerHTML = renderPending(c, m.status); return; }
      if (c.plan === 'Suspenso') { r.innerHTML = renderBlocked(c); return; }
      if (S.view === 'admin' && isStaff()) { r.innerHTML = renderAdmin(); return; }
      S.view = 'app'; r.innerHTML = renderApp();
    }

    window.addEventListener('storage', e => {
      if (e.key !== DB_KEY) return;
      db = loadDB();
      const a = document.activeElement;
      if (a && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName)) return;
      render();
    });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    render();
  </script>
</body>
</html>
