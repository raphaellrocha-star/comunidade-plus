<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Comunidade+ — App da Igreja</title>
  <meta name="theme-color" content="#4338CA" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Comunidade+" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%234338CA'/%3E%3Cstop offset='100%25' stop-color='%237C3AED'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='112' fill='url(%23bg)'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' fill='%23FFF' font-family='sans-serif' font-size='210' font-weight='800'%3EC+%3C/text%3E%3C/svg%3E" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #F4F6FB;
      color: #0F172A;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      margin: 0;
      padding: 0;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .hero-gradient { background: linear-gradient(135deg, #4338CA 0%, #5B50E6 55%, #7C3AED 100%); }
    .pix-gradient { background: linear-gradient(135deg, #059669 0%, #10B981 100%); }
    .safe-bottom { padding-bottom: max(0.5rem, env(safe-area-inset-bottom)); }
    .safe-top { padding-top: max(0.75rem, env(safe-area-inset-top)); }
  </style>
</head>
<body class="antialiased min-h-screen">
  <div id="root" class="min-h-screen flex flex-col"></div>

  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 hidden max-w-xs w-[90%] bg-slate-900 text-white shadow-xl rounded-2xl px-4 py-3 text-xs font-medium flex items-center gap-2.5">
    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 shrink-0"></span>
    <span id="toast-msg"></span>
  </div>

  <script>
    const PROFILES = {
      evangelica: {
        label: 'Igreja Evangélica', defaultName: 'Igreja Vida Nova', service: 'Culto', services: 'Cultos',
        tithe: 'Dízimo', offering: 'Oferta', missions: 'Missões', groups: 'Células', leader: 'Pastor',
        ministry: 'Ministério', prayer: 'Pedido de Oração', prayers: 'Pedidos de Oração',
        verse: '“Porque onde estiverem dois ou três reunidos em meu nome, ali estou no meio deles.” — Mateus 18:20'
      },
      catolica: {
        label: 'Paróquia Católica', defaultName: 'Paróquia São José', service: 'Missa', services: 'Missas',
        tithe: 'Dízimo', offering: 'Oferta', missions: 'Ação Social', groups: 'Pastorais', leader: 'Padre',
        ministry: 'Pastoral', prayer: 'Intenção de Oração', prayers: 'Intenções de Oração',
        verse: '“O Senhor é o meu pastor, nada me faltará.” — Salmo 23:1'
      },
      generico: {
        label: 'Templo / Genérico', defaultName: 'Comunidade Luz & Paz', service: 'Encontro', services: 'Encontros',
        tithe: 'Contribuição', offering: 'Doação', missions: 'Projetos Sociais', groups: 'Grupos', leader: 'Liderança',
        ministry: 'Equipe', prayer: 'Pedido de Apoio', prayers: 'Pedidos de Apoio',
        verse: '“A união e o cuidado mútuo fortalecem toda a comunidade.”'
      }
    };

    const STORAGE_KEY = 'comunidade_plus_mobile_single_v1';

    function getDefaultState() {
      return {
        mode: 'member', memberTab: 'home', adminTab: 'overview', profileKey: 'evangelica',
        churchName: 'Igreja Vida Nova', churchCnpj: '12.345.678/0001-90', churchCity: 'São Paulo',
        dailyMessage: PROFILES.evangelica.verse, currentUser: 'Lucas Silva',
        pixKey: 'financeiro@igrejavidanova.org.br', membersCount: 342,
        announcements: [
          { id: 1, title: 'Inscrições abertas para o Batismo', body: 'Nosso próximo batismo será no domingo dia 07/12 às 10h. Faça sua inscrição na aba Agenda.', tag: 'Importante', date: 'Hoje, 09:30' },
          { id: 2, title: 'Cesta Solidária de Natal', body: 'Estamos arrecadando alimentos não perecíveis para abençoar 80 famílias da região.', tag: 'Ação Social', date: 'Ontem' }
        ],
        events: [
          { id: 101, title: 'Culto da Família', date: 'Domingo • 18:30', location: 'Templo Principal', spots: 250, registered: 148, userRegistered: true },
          { id: 102, title: 'Noite de Louvor e Adoração', date: 'Quarta • 20:00', location: 'Auditório Central', spots: 120, registered: 64, userRegistered: false },
          { id: 103, title: 'Encontro de Jovens — Conexão', date: 'Sábado • 19:30', location: 'Espaço Jovem', spots: 80, registered: 52, userRegistered: false }
        ],
        schedules: [
          { id: 201, event: 'Culto da Família — Dom 18:30', ministry: 'Louvor (Violão)', volunteer: 'Lucas Silva', status: 'pending' },
          { id: 202, event: 'Noite de Louvor — Qua 20:00', ministry: 'Mídia & Projeção', volunteer: 'Lucas Silva', status: 'confirmed' },
          { id: 203, event: 'Culto da Família — Dom 18:30', ministry: 'Recepção', volunteer: 'Mariana Costa', status: 'confirmed' }
        ],
        prayers: [
          { id: 301, author: 'Ana Paula', text: 'Peço oração pela recuperação da cirurgia da minha mãe nesta semana.', isPrivate: false, status: 'praying', prayCount: 14, date: 'Hoje, 08:15' },
          { id: 302, author: 'Anônimo', text: 'Direção para uma nova porta de emprego e paz para nossa família.', isPrivate: true, status: 'new', prayCount: 3, date: 'Ontem' }
        ],
        contributions: [
          { id: 401, member: 'Carlos Eduardo', category: 'tithe', amount: 350, status: 'confirmed', date: 'Hoje, 09:10' },
          { id: 402, member: 'Fernanda Lima', category: 'offering', amount: 120, status: 'confirmed', date: 'Ontem' },
          { id: 404, member: 'João Pedro', category: 'tithe', amount: 500, status: 'pending_check', date: 'Hoje, 10:05' }
        ],
        pixFlow: { step: 'form', category: 'tithe', amount: 100, txid: '', payload: '', lastReceipt: null },
        activityLog: [
          { time: '10:05', text: 'João Pedro informou Pix direto de R$ 500,00 (aguardando conferência)' },
          { time: '09:30', text: 'Novo aviso publicado: Inscrições abertas para o Batismo' }
        ]
      };
    }

    let state = loadState();
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const p = JSON.parse(raw);
          return { ...getDefaultState(), ...p, pixFlow: { ...getDefaultState().pixFlow, ...(p.pixFlow || {}) } };
        }
      } catch (e) {}
      return getDefaultState();
    }
    function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
    function t(k) { return PROFILES[state.profileKey][k] || k; }
    function fmtCurrency(v) { return Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
    function nowTime() { return new Date().toTimeString().slice(0, 5); }
    function logActivity(text) { state.activityLog.unshift({ time: nowTime(), text }); if (state.activityLog.length > 8) state.activityLog.pop(); }
    function escapeHtml(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('hidden'), 3000);
    }

    function removeAccents(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9 .@-]/g, ''); }
    function emvField(id, v) { return `${id}${String(v.length).padStart(2, '0')}${v}`; }
    function crc16CCITT(s) {
      let crc = 0xFFFF;
      for (let i = 0; i < s.length; i++) {
        crc ^= (s.charCodeAt(i) << 8);
        for (let j = 0; j < 8; j++) { crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1); crc &= 0xFFFF; }
      }
      return crc.toString(16).toUpperCase().padStart(4, '0');
    }
    function generatePixBRCode(pixKey, name, city, amount, txid) {
      const ma = emvField('26', emvField('00', 'br.gov.bcb.pix') + emvField('01', pixKey.trim()));
      const p = emvField('00', '01') + ma + emvField('52', '0000') + emvField('53', '986') + emvField('54', Number(amount).toFixed(2)) + emvField('58', 'BR') + emvField('59', removeAccents(name).slice(0, 25).toUpperCase() || 'IGREJA') + emvField('60', removeAccents(city).slice(0, 15).toUpperCase() || 'SAO PAULO') + emvField('62', emvField('05', txid)) + '6304';
      return p + crc16CCITT(p);
    }

    function renderVisualQR(payload) {
      if (window.qrcode) { try { const q = qrcode(0, 'M'); q.addData(payload); q.make(); return q.createSvgTag({ cellSize: 5, margin: 2, scalable: true }).replace('<svg ', '<svg class="w-48 h-48 mx-auto" '); } catch (e) {} }
      return renderFakeQR(payload);
    }
    function renderFakeQR(payload) {
      const size = 21;
      let hash = 2166136261;
      for (let i = 0; i < payload.length; i++) { hash ^= payload.charCodeAt(i); hash = Math.imul(hash, 16777619); }
      function bit(r, c) {
        const corner = (r < 7 && c < 7) || (r < 7 && c >= size - 7) || (r >= size - 7 && c < 7);
        if (corner) {
          const lr = r < 7 ? r : r - (size - 7), lc = c < 7 ? c : c - (size - 7);
          return lr === 0 || lr === 6 || lc === 0 || lc === 6 || (lr >= 2 && lr <= 4 && lc >= 2 && lc <= 4);
        }
        if (r >= 8 && r <= 12 && c >= 8 && c <= 12) return false;
        return ((Math.imul(hash ^ (r * 31 + c * 17), 2654435761) >>> 28) & 1) === 1;
      }
      let rects = '';
      for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) if (bit(r, c)) rects += `<rect x="${c * 8 + 8}" y="${r * 8 + 8}" width="7" height="7" rx="1.5" fill="#0F172A"/>`;
      return `<svg viewBox="0 0 184 184" class="w-44 h-44 mx-auto"><rect width="184" height="184" rx="14" fill="#FFF"/>${rects}<rect x="74" y="74" width="36" height="36" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/><path d="M92 83 L99 90 L92 97 L85 90 Z" fill="#059669"/></svg>`;
    }

    function toggleMode() { state.mode = state.mode === 'member' ? 'admin' : 'member'; saveState(); render(); window.scrollTo(0, 0); }
    function setMemberTab(tab) { state.memberTab = tab; if (tab === 'give' && state.pixFlow.step === 'receipt') state.pixFlow.step = 'form'; saveState(); render(); window.scrollTo(0, 0); }
    function setAdminTab(tab) { state.adminTab = tab; saveState(); render(); }
    function setProfile(key) {
      const oldDef = PROFILES[state.profileKey].defaultName, oldV = PROFILES[state.profileKey].verse;
      state.profileKey = key;
      if (state.churchName === oldDef) state.churchName = PROFILES[key].defaultName;
      if (state.dailyMessage === oldV) state.dailyMessage = PROFILES[key].verse;
      saveState(); render(); showToast(`Perfil: ${PROFILES[key].label}`);
    }
    function toggleEventRegistration(id) {
      const ev = state.events.find(e => e.id === id);
      if (!ev) return;
      ev.userRegistered = !ev.userRegistered;
      ev.registered += ev.userRegistered ? 1 : -1;
      logActivity(ev.userRegistered ? `${state.currentUser} se inscreveu em "${ev.title}"` : `${state.currentUser} cancelou inscrição`);
      saveState(); render(); showToast(ev.userRegistered ? 'Presença confirmada!' : 'Inscrição cancelada.');
    }
    function selectPixCategory(c) { state.pixFlow.category = c; saveState(); render(); }
    function selectPixAmount(v) { state.pixFlow.amount = Number(v); saveState(); render(); }
    function startPixGeneration(e) {
      e.preventDefault();
      const input = document.getElementById('custom-amount');
      const amount = Number(input ? input.value : state.pixFlow.amount);
      if (!amount || amount <= 0) { showToast('Informe um valor válido.'); return; }
      const txid = 'IGR' + String(Date.now()).slice(-8);
      state.pixFlow = { ...state.pixFlow, step: 'qrcode', amount, txid, payload: generatePixBRCode(state.pixKey, state.churchName, state.churchCity, amount, txid) };
      saveState(); render();
    }
    function copyPixPayload() { if (navigator.clipboard) navigator.clipboard.writeText(state.pixFlow.payload || state.pixKey).catch(() => {}); showToast('Pix Copia e Cola copiado!'); }
    function copyPixKeyDirect() { if (navigator.clipboard) navigator.clipboard.writeText(state.pixKey).catch(() => {}); showToast('Chave Pix copiada!'); }
    function confirmMemberPixSent() {
      const rec = { id: Date.now(), member: state.currentUser, category: state.pixFlow.category, amount: state.pixFlow.amount, status: 'pending_check', date: `Hoje, ${nowTime()}` };
      state.contributions.unshift(rec);
      state.pixFlow.step = 'receipt';
      state.pixFlow.lastReceipt = rec;
      logActivity(`${state.currentUser} informou Pix direto de ${fmtCurrency(rec.amount)}`);
      saveState(); render(); showToast('Aviso enviado à tesouraria!');
    }
    function resetPixStep() { state.pixFlow.step = 'form'; saveState(); render(); }
    function confirmContributionAdmin(id) {
      const c = state.contributions.find(x => x.id === id);
      if (c) { c.status = 'confirmed'; logActivity(`Tesouraria confirmou Pix de ${c.member}`); saveState(); render(); showToast('Confirmado no extrato!'); }
    }
    function submitPrayer(e) {
      e.preventDefault();
      const text = document.getElementById('prayer-text').value.trim();
      if (!text) return;
      state.prayers.unshift({ id: Date.now(), author: document.getElementById('prayer-anon').checked ? 'Anônimo' : state.currentUser, text, isPrivate: document.getElementById('prayer-private').checked, status: 'new', prayCount: 1, date: `Hoje, ${nowTime()}` });
      logActivity(`Novo ${t('prayer').toLowerCase()} recebido`);
      saveState(); render(); showToast('Pedido enviado!');
    }
    function incrementPray(id) { const p = state.prayers.find(x => x.id === id); if (p) { p.prayCount += 1; saveState(); render(); } }
    function updateScheduleStatus(id, st) { const s = state.schedules.find(x => x.id === id); if (s) { s.status = st; saveState(); render(); showToast(st === 'confirmed' ? 'Confirmado!' : 'Troca solicitada.'); } }
    function addAnnouncement(e) {
      e.preventDefault();
      const title = document.getElementById('adm-ann-title').value.trim(), body = document.getElementById('adm-ann-body').value.trim();
      if (!title || !body) return;
      state.announcements.unshift({ id: Date.now(), title, body, tag: document.getElementById('adm-ann-tag').value, date: `Hoje, ${nowTime()}` });
      saveState(); render(); logActivity(`Novo aviso: ${title}`); saveState(); showToast('Aviso publicado!');
    }
    function addEvent(e) {
      e.preventDefault();
      const title = document.getElementById('adm-ev-title').value.trim(), date = document.getElementById('adm-ev-date').value.trim();
      if (!title || !date) return;
      state.events.unshift({ id: Date.now(), title, date, location: document.getElementById('adm-ev-loc').value.trim() || 'Templo Principal', spots: Number(document.getElementById('adm-ev-spots').value) || 100, registered: 0, userRegistered: false });
      saveState(); render(); logActivity(`Novo evento: ${title}`); saveState(); showToast('Evento criado!');
    }
    function updatePrayerStatus(id, st) { const p = state.prayers.find(x => x.id === id); if (p) { p.status = st; saveState(); render(); showToast('Atualizado!'); } }
    function saveChurchSettings(e) {
      e.preventDefault();
      state.churchName = document.getElementById('set-name').value.trim() || state.churchName;
      state.churchCnpj = document.getElementById('set-cnpj').value.trim() || state.churchCnpj;
      state.churchCity = document.getElementById('set-city').value.trim() || state.churchCity;
      state.pixKey = document.getElementById('set-pix').value.trim() || state.pixKey;
      state.dailyMessage = document.getElementById('set-msg').value.trim() || state.dailyMessage;
      saveState(); render(); showToast('Configurações salvas!');
    }
    function resetDemo() { localStorage.removeItem(STORAGE_KEY); state = getDefaultState(); render(); showToast('Dados restaurados.'); }

    function statusBadge(st) {
      if (st === 'confirmed' || st === 'answered') return `<span class="text-[11px] px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 font-semibold">${st === 'confirmed' ? 'Confirmado' : 'Atendido'}</span>`;
      if (st === 'pending_check') return `<span class="text-[11px] px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200 font-semibold">Conferir extrato</span>`;
      if (st === 'swap') return `<span class="text-[11px] px-2.5 py-0.5 rounded-full bg-rose-50 text-rose-700 border border-rose-200 font-semibold">Troca pedida</span>`;
      if (st === 'praying') return `<span class="text-[11px] px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200 font-semibold">Em Oração</span>`;
      return `<span class="text-[11px] px-2.5 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200 font-semibold">${st === 'new' ? 'Novo' : 'Pendente'}</span>`;
    }
    function churchInitials() { return state.churchName.split(' ').filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || 'C+'; }

    function renderMemberView() {
      const mySchedules = state.schedules.filter(s => s.volunteer.toLowerCase() === state.currentUser.toLowerCase());
      let body = '';
      if (state.memberTab === 'home') {
        const nextEv = state.events[0];
        body = `
          <div class="space-y-4">
            <div class="rounded-3xl hero-gradient text-white p-5 shadow-md">
              <div class="flex justify-between text-xs text-indigo-100 mb-2"><span class="px-2.5 py-0.5 rounded-full bg-white/15 font-medium">Palavra do Dia</span><span>${escapeHtml(state.churchCity)}</span></div>
              <p class="text-sm leading-relaxed font-medium">${escapeHtml(state.dailyMessage)}</p>
            </div>
            <div class="grid grid-cols-4 gap-2.5">
              <button onclick="setMemberTab('give')" class="flex flex-col items-center gap-1.5 p-3 rounded-2xl bg-white border border-slate-100 shadow-sm"><div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold text-xs">R$</div><span class="text-xs font-semibold text-slate-700">Pix</span></button>
              <button onclick="setMemberTab('prayer')" class="flex flex-col items-center gap-1.5 p-3 rounded-2xl bg-white border border-slate-100 shadow-sm"><div class="w-10 h-10 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center font-bold text-xs">♥</div><span class="text-xs font-semibold text-slate-700">Oração</span></button>
              <button onclick="setMemberTab('schedule')" class="flex flex-col items-center gap-1.5 p-3 rounded-2xl bg-white border border-slate-100 shadow-sm"><div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold text-xs">✓</div><span class="text-xs font-semibold text-slate-700">Escala</span></button>
              <button onclick="setMemberTab('events')" class="flex flex-col items-center gap-1.5 p-3 rounded-2xl bg-white border border-slate-100 shadow-sm"><div class="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center font-bold text-xs">📅</div><span class="text-xs font-semibold text-slate-700">Agenda</span></button>
            </div>
            ${nextEv ? `<div class="rounded-2xl bg-white border border-slate-200/80 p-4 shadow-sm space-y-2"><div class="flex justify-between"><span class="text-xs font-bold text-indigo-600 uppercase">Próximo ${escapeHtml(t('service'))}</span><span class="text-xs text-slate-500">${escapeHtml(nextEv.date)}</span></div><div class="font-bold text-base">${escapeHtml(nextEv.title)}</div><div class="flex justify-between items-center text-xs text-slate-500"><span>${escapeHtml(nextEv.location)}</span><button onclick="toggleEventRegistration(${nextEv.id})" class="px-3.5 py-1.5 rounded-xl font-semibold ${nextEv.userRegistered ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-indigo-600 text-white'}">${nextEv.userRegistered ? 'Inscrito ✓' : 'Participar'}</button></div></div>` : ''}
            <div class="space-y-3">
              <div class="text-xs font-bold uppercase tracking-wider text-slate-500 px-1">Mural de Avisos</div>
              ${state.announcements.map(a => `<div class="rounded-2xl bg-white border border-slate-200/80 p-4 shadow-sm space-y-1.5"><div class="flex justify-between"><span class="text-[11px] px-2.5 py-0.5 rounded-lg bg-indigo-50 text-indigo-700 font-semibold">${escapeHtml(a.tag)}</span><span class="text-xs text-slate-400">${escapeHtml(a.date)}</span></div><div class="font-bold text-sm">${escapeHtml(a.title)}</div><p class="text-xs text-slate-600 leading-relaxed">${escapeHtml(a.body)}</p></div>`).join('')}
            </div>
          </div>`;
      } else if (state.memberTab === 'events') {
        body = `<div class="space-y-3"><h2 class="font-bold text-base">Agenda de ${escapeHtml(t('services'))} & Eventos</h2>${state.events.map(ev => `<div class="rounded-2xl bg-white border border-slate-200/80 p-4 shadow-sm space-y-3"><div><div class="font-bold text-sm">${escapeHtml(ev.title)}</div><div class="text-xs text-slate-500">${escapeHtml(ev.date)} • ${escapeHtml(ev.location)}</div><div class="text-[11px] text-slate-400 mt-1">${ev.registered}/${ev.spots} inscritos • ${Math.max(0, ev.spots - ev.registered)} vagas</div></div><button onclick="toggleEventRegistration(${ev.id})" class="w-full py-2.5 rounded-xl text-xs font-bold ${ev.userRegistered ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-indigo-600 text-white'}">${ev.userRegistered ? 'Presença Confirmada ✓' : 'Confirmar Inscrição'}</button></div>`).join('')}</div>`;
      } else if (state.memberTab === 'give') {
        const pf = state.pixFlow;
        if (pf.step === 'form') {
          body = `
            <form onsubmit="startPixGeneration(event)" class="space-y-4">
              <div class="rounded-2xl bg-emerald-50 border border-emerald-200 p-3.5 text-xs"><div class="font-bold text-emerald-900">Pix 100% Direto para a Igreja</div><div class="text-emerald-700 mt-0.5">Cai direto na conta PJ da igreja • <b>Taxa R$ 0,00</b></div></div>
              <div class="grid grid-cols-3 gap-2">${['tithe', 'offering', 'missions'].map(c => `<button type="button" onclick="selectPixCategory('${c}')" class="py-2.5 rounded-xl text-xs font-semibold border ${pf.category === c ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-700 border-slate-200'}">${escapeHtml(t(c))}</button>`).join('')}</div>
              <div class="grid grid-cols-4 gap-2">${[50, 100, 200, 500].map(v => `<button type="button" onclick="selectPixAmount(${v})" class="py-2 rounded-xl text-xs font-semibold border ${pf.amount === v ? 'bg-emerald-50 text-emerald-700 border-emerald-400' : 'bg-white border-slate-200'}">R$ ${v}</button>`).join('')}</div>
              <input id="custom-amount" type="number" min="1" value="${pf.amount}" oninput="state.pixFlow.amount = Number(this.value)" class="w-full px-4 py-3 rounded-xl bg-white border border-slate-200 text-base font-bold" />
              <button type="submit" class="w-full py-3.5 rounded-2xl pix-gradient text-white text-sm font-bold shadow-md">Gerar Pix de ${fmtCurrency(pf.amount)}</button>
              <div class="rounded-2xl bg-white border border-slate-200 p-3.5 space-y-1"><div class="flex justify-between"><span class="text-xs text-slate-500">Chave Pix da Igreja</span><button type="button" onclick="copyPixKeyDirect()" class="text-xs font-bold text-emerald-700">Copiar</button></div><div class="text-xs font-mono truncate">${escapeHtml(state.pixKey)}</div><div class="text-[11px] text-slate-500">${escapeHtml(state.churchName)} • CNPJ ${escapeHtml(state.churchCnpj)}</div></div>
            </form>`;
        } else if (pf.step === 'qrcode') {
          body = `
            <div class="space-y-4">
              <div class="flex justify-between items-center"><button onclick="resetPixStep()" class="text-xs font-semibold text-slate-500">← Voltar</button><span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-50 text-emerald-700">Taxa R$ 0</span></div>
              <div class="rounded-3xl bg-white border border-slate-200 p-5 text-center space-y-3 shadow-sm">
                <div class="text-xs text-slate-500">${escapeHtml(t(pf.category))} para <b>${escapeHtml(state.churchName)}</b></div>
                <div class="text-3xl font-extrabold">${fmtCurrency(pf.amount)}</div><div class="text-[11px] text-slate-500">CNPJ ${escapeHtml(state.churchCnpj)} • Chave ${escapeHtml(state.pixKey)}</div>
                <div class="p-2 rounded-2xl bg-slate-50 inline-block">${renderVisualQR(pf.payload)}</div>
                <button onclick="copyPixPayload()" class="w-full py-3 rounded-xl bg-slate-900 text-white text-xs font-bold">Copiar Pix Copia e Cola (BR Code)</button>
              </div>
              <button onclick="confirmMemberPixSent()" class="w-full py-3.5 rounded-2xl pix-gradient text-white text-sm font-bold shadow-md">Já fiz o Pix no meu banco ✓</button>
            </div>`;
        } else {
          const r = pf.lastReceipt;
          body = `<div class="py-6 text-center space-y-4"><div class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto text-2xl font-bold">✓</div><h2 class="font-bold text-lg">Aviso de Pix Enviado!</h2><div class="rounded-2xl bg-white border border-slate-200 p-4 text-left space-y-2 text-xs"><div class="flex justify-between"><span>Valor</span><b class="text-emerald-700">${fmtCurrency(r.amount)}</b></div><div class="flex justify-between"><span>Status</span>${statusBadge(r.status)}</div></div><button onclick="resetPixStep()" class="w-full py-3 rounded-xl bg-indigo-600 text-white text-xs font-bold">Nova Contribuição</button></div>`;
        }
      } else if (state.memberTab === 'prayer') {
        body = `<div class="space-y-4"><form onsubmit="submitPrayer(event)" class="rounded-2xl bg-white border border-slate-200 p-4 shadow-sm space-y-3"><div class="font-bold text-sm">Enviar ${escapeHtml(t('prayer'))}</div><textarea id="prayer-text" rows="3" required placeholder="Compartilhe seu motivo..." class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm resize-none"></textarea><div class="flex gap-4 text-xs"><label class="flex items-center gap-1.5"><input id="prayer-anon" type="checkbox"/> Anônimo</label><label class="flex items-center gap-1.5"><input id="prayer-private" type="checkbox"/> Privado</label></div><button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 text-white text-xs font-bold">Enviar Pedido</button></form>${state.prayers.filter(p => !p.isPrivate).map(p => `<div class="rounded-2xl bg-white border border-slate-200 p-4 shadow-sm space-y-2"><div class="flex justify-between text-xs"><b>${escapeHtml(p.author)}</b><span class="text-slate-400">${escapeHtml(p.date)}</span></div><p class="text-xs text-slate-600">${escapeHtml(p.text)}</p><button onclick="incrementPray(${p.id})" class="text-xs px-3 py-1.5 rounded-xl bg-rose-50 text-rose-700 font-semibold">Estou orando (${p.prayCount})</button></div>`).join('')}</div>`;
      } else {
        body = `<div class="space-y-3"><h2 class="font-bold text-base">Minha Escala</h2>${mySchedules.map(s => `<div class="rounded-2xl bg-white border border-slate-200 p-4 shadow-sm space-y-3"><div class="flex justify-between items-start"><div><div class="font-bold text-sm">${escapeHtml(s.ministry)}</div><div class="text-xs text-slate-500">${escapeHtml(s.event)}</div></div>${statusBadge(s.status)}</div><div class="flex gap-2"><button onclick="updateScheduleStatus(${s.id}, 'confirmed')" class="flex-1 py-2.5 rounded-xl text-xs font-bold bg-indigo-600 text-white">Confirmar</button><button onclick="updateScheduleStatus(${s.id}, 'swap')" class="flex-1 py-2.5 rounded-xl text-xs font-semibold bg-slate-100">Pedir Troca</button></div></div>`).join('')}</div>`;
      }

      const nav = [
        { id: 'home', label: 'Início' }, { id: 'events', label: 'Agenda' },
        { id: 'give', label: 'Pix' }, { id: 'prayer', label: 'Oração' }, { id: 'schedule', label: 'Escala' }
      ];

      return `
        <div class="min-h-screen flex flex-col max-w-md mx-auto w-full bg-[#F4F6FB] md:shadow-xl md:border-x md:border-slate-200">
          <header class="sticky top-0 z-20 bg-white/95 backdrop-blur-md border-b border-slate-100 px-4 pb-3 safe-top flex items-center justify-between gap-2">
            <div class="flex items-center gap-2.5 min-w-0">
              <div class="w-9 h-9 rounded-2xl hero-gradient text-white flex items-center justify-center font-bold text-xs shrink-0">${escapeHtml(churchInitials())}</div>
              <div class="min-w-0"><div class="font-bold text-sm truncate">${escapeHtml(state.churchName)}</div><div class="text-[11px] text-slate-500">Olá, ${escapeHtml(state.currentUser.split(' ')[0])}</div></div>
            </div>
            <button onclick="toggleMode()" class="px-3 py-1.5 rounded-xl bg-indigo-50 text-indigo-700 border border-indigo-100 text-xs font-bold shrink-0">Painel Admin</button>
          </header>
          <main class="flex-1 p-4 pb-24">${body}</main>
          <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 max-w-md w-full z-20 grid grid-cols-5 bg-white/95 backdrop-blur-md border-t border-slate-200 px-1 pt-2 safe-bottom">
            ${nav.map(i => `<button onclick="setMemberTab('${i.id}')" class="py-2 text-xs ${state.memberTab === i.id ? 'text-indigo-600 font-bold' : 'text-slate-400 font-medium'}">${i.label}</button>`).join('')}
          </nav>
        </div>`;
    }

    function renderAdminView() {
      const confirmedMoney = state.contributions.filter(c => c.status === 'confirmed').reduce((a, c) => a + Number(c.amount), 0);
      const pendingCount = state.contributions.filter(c => c.status === 'pending_check').length;
      const tabs = [{ id: 'overview', label: 'Resumo' }, { id: 'finance', label: `Pix (${pendingCount})` }, { id: 'content', label: 'Avisos' }, { id: 'prayers', label: 'Oração' }, { id: 'settings', label: 'Conta' }];
      let body = '';
      if (state.adminTab === 'overview') {
        body = `<div class="space-y-4"><div class="grid grid-cols-2 gap-3"><div class="rounded-2xl bg-white border border-slate-200 p-4"><div class="text-xs text-slate-500">Membros</div><div class="text-2xl font-extrabold mt-1">${state.membersCount}</div></div><div class="rounded-2xl bg-emerald-50 border border-emerald-200 p-4"><div class="text-xs text-emerald-800">Pix Confirmado</div><div class="text-xl font-extrabold text-emerald-900 mt-1">${fmtCurrency(confirmedMoney)}</div></div></div><div class="rounded-2xl bg-white border border-slate-200 p-4 space-y-2"><div class="font-bold text-sm">Atividade Recente</div>${state.activityLog.map(i => `<div class="py-1.5 text-xs text-slate-700 border-b border-slate-100 last:border-0"><span class="font-mono text-slate-400 mr-2">${escapeHtml(i.time)}</span>${escapeHtml(i.text)}</div>`).join('')}</div></div>`;
      } else if (state.adminTab === 'finance') {
        body = `<div class="space-y-3"><div class="rounded-2xl bg-emerald-50 border border-emerald-200 p-3.5 text-xs text-emerald-900"><b>Pix Direto Ativo (Taxa R$ 0,00)</b><br/>Chave: <span class="font-mono">${escapeHtml(state.pixKey)}</span></div>${state.contributions.map(c => `<div class="rounded-2xl bg-white border border-slate-200 p-4 flex justify-between items-center"><div><div class="font-bold text-sm">${escapeHtml(c.member)}</div><div class="text-xs text-slate-500">${escapeHtml(t(c.category))} • ${escapeHtml(c.date)}</div><div class="mt-1">${statusBadge(c.status)}</div></div><div class="text-right space-y-1.5"><div class="font-extrabold text-sm text-emerald-700">${fmtCurrency(c.amount)}</div>${c.status === 'pending_check' ? `<button onclick="confirmContributionAdmin(${c.id})" class="px-3 py-1 rounded-xl bg-emerald-600 text-white text-xs font-bold">Confirmar ✓</button>` : ''}</div></div>`).join('')}</div>`;
      } else if (state.adminTab === 'content') {
        body = `<div class="space-y-4"><form onsubmit="addAnnouncement(event)" class="rounded-2xl bg-white border border-slate-200 p-4 space-y-2.5"><div class="font-bold text-sm">Publicar Aviso</div><input id="adm-ann-title" required placeholder="Título" class="w-full px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs"/><textarea id="adm-ann-body" rows="2" required placeholder="Mensagem..." class="w-full px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs"></textarea><div class="flex gap-2"><select id="adm-ann-tag" class="px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs"><option>Importante</option><option>Aviso Geral</option></select><button type="submit" class="flex-1 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold">Publicar</button></div></form><form onsubmit="addEvent(event)" class="rounded-2xl bg-white border border-slate-200 p-4 space-y-2.5"><div class="font-bold text-sm">Criar Evento</div><input id="adm-ev-title" required placeholder="Nome" class="w-full px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs"/><input id="adm-ev-date" required placeholder="Sexta • 20:00" class="w-full px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs"/><input id="adm-ev-loc" placeholder="Local" class="w-full px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs"/><input id="adm-ev-spots" type="hidden" value="100"/><button type="submit" class="w-full py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-bold">Criar Evento</button></form><div class="rounded-2xl bg-white border border-slate-200 p-4 space-y-2"><div class="font-bold text-sm">Publicados</div>${state.announcements.map(a => `<div class="flex justify-between items-center text-xs py-1.5 border-b border-slate-100"><span>📢 ${escapeHtml(a.title)}</span><button onclick="deleteItem('announcements',${a.id})" class="text-rose-600 font-semibold">Excluir</button></div>`).join('')}${state.events.map(ev => `<div class="flex justify-between items-center text-xs py-1.5 border-b border-slate-100"><span>📅 ${escapeHtml(ev.title)}</span><button onclick="deleteItem('events',${ev.id})" class="text-rose-600 font-semibold">Excluir</button></div>`).join('')}</div></div>`;
      } else if (state.adminTab === 'prayers') {
        body = `<div class="space-y-3">${state.prayers.map(p => `<div class="rounded-2xl bg-white border border-slate-200 p-4 space-y-2"><div class="flex justify-between text-xs"><b>${escapeHtml(p.author)}</b>${statusBadge(p.status)}</div><p class="text-xs text-slate-600">${escapeHtml(p.text)}</p><div class="flex gap-2"><button onclick="updatePrayerStatus(${p.id}, 'praying')" class="flex-1 py-2 rounded-xl bg-indigo-50 text-indigo-700 text-xs font-semibold">Em Oração</button><button onclick="updatePrayerStatus(${p.id}, 'answered')" class="flex-1 py-2 rounded-xl bg-emerald-50 text-emerald-700 text-xs font-semibold">Atendido</button></div></div>`).join('')}</div>`;
      } else {
        body = `<form onsubmit="saveChurchSettings(event)" class="rounded-2xl bg-white border border-slate-200 p-4 space-y-3"><div class="font-bold text-sm">Conta Pix & Perfil</div><select onchange="setProfile(this.value)" class="w-full px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs"><option value="evangelica" ${state.profileKey === 'evangelica' ? 'selected' : ''}>Igreja Evangélica</option><option value="catolica" ${state.profileKey === 'catolica' ? 'selected' : ''}>Paróquia Católica</option><option value="generico" ${state.profileKey === 'generico' ? 'selected' : ''}>Templo / Genérico</option></select><input id="set-name" value="${escapeHtml(state.churchName)}" class="w-full px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs"/><input id="set-cnpj" value="${escapeHtml(state.churchCnpj)}" class="w-full px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs"/><input id="set-pix" value="${escapeHtml(state.pixKey)}" class="w-full px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-mono"/><input id="set-city" value="${escapeHtml(state.churchCity)}" class="w-full px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs"/><textarea id="set-msg" rows="2" class="w-full px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs">${escapeHtml(state.dailyMessage)}</textarea><button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 text-white text-xs font-bold">Salvar</button><button type="button" onclick="resetDemo()" class="w-full py-2 rounded-xl border border-slate-200 text-xs text-slate-500">Restaurar dados</button></form>`;
      }
      return `<div class="min-h-screen flex flex-col max-w-2xl mx-auto w-full bg-[#F4F6FB]"><header class="sticky top-0 z-20 bg-white border-b border-slate-200 px-4 pb-3 safe-top flex justify-between items-center"><div><div class="font-bold text-sm">Painel da Igreja</div><div class="text-[11px] text-slate-500">${escapeHtml(state.churchName)}</div></div><button onclick="toggleMode()" class="px-3 py-1.5 rounded-xl bg-slate-900 text-white text-xs font-bold">App do Fiel</button></header><div class="bg-white border-b border-slate-200 px-3 flex gap-1 overflow-x-auto hide-scrollbar">${tabs.map(t => `<button onclick="setAdminTab('${t.id}')" class="px-3 py-2.5 text-xs whitespace-nowrap border-b-2 ${state.adminTab === t.id ? 'border-indigo-600 text-indigo-700 font-bold' : 'border-transparent text-slate-500'}">${t.label}</button>`).join('')}</div><main class="flex-1 p-4 pb-10">${body}</main></div>`;
    }

    function deleteItem(list, id) { state[list] = state[list].filter(x => x.id !== id); logActivity('Item removido do mural/agenda'); saveState(); render(); showToast('Excluído.'); }
    window.addEventListener('storage', e => { if (e.key === STORAGE_KEY) { const m = state.mode, mt = state.memberTab, at = state.adminTab; state = loadState(); state.mode = m; state.memberTab = mt; state.adminTab = at; render(); } });
    function render() { document.getElementById('root').innerHTML = state.mode === 'member' ? renderMemberView() : renderAdminView(); }
    render();
  </script>
</body>
</html>
